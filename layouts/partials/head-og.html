<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if eq .Kind "page" }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
{{ if and (eq .Kind "page") .Date }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
<meta name="twitter:card" content="summary">
{{ if eq .Kind "page" }}
<script type="application/ld+json">{{ dict
  "@context" "https://schema.org"
  "@type" "BlogPosting"
  "headline" .Title
  "description" (cond (ne .Description "") .Description .Site.Params.description)
  "url" .Permalink
  "datePublished" (.Date.Format "2006-01-02")
  "author" (dict "@type" "Person" "name" .Site.Title)
  | jsonify | safeJS }}</script>
{{ end }}

<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &middot; {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">{{ end }}
{{ partial "head-og.html" . }}
{{ if .Params.math }}{{ partial "katex.html" . }}{{ end }}
{{ with resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{ end }}
</head>
<body>
<div class="shell">
  {{ partial "sidebar.html" . }}
  <main class="content">
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
  </main>
</div>
</body>
</html>

{{- $page := .Page -}}
{{- $caption := .Get "caption" -}}
<figure class="figure-row">
  <div class="figure-row-images">
    <img src="{{ .Get "src1" }}" alt="{{ .Get "alt1" | default "" }}">
    <img src="{{ .Get "src2" }}" alt="{{ .Get "alt2" | default "" }}">
  </div>
  {{- with $caption }}<figcaption>{{ $page.RenderString . }}</figcaption>{{ end -}}
</figure>

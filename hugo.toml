baseURL = "https://vderm.github.io/"
locale = "en-us"
title = "Vasken Dermardiros"

# Built output is committed and served by GitHub Pages (Settings > Pages >
# Source: "Deploy from a branch", branch master, folder /docs).
publishDir = "docs"

# Content is generated by the vault exporter; never hand-edited here.
enableGitInfo = false
disableKinds = ["taxonomy"]   # keep /tags/<tag>/ pages, drop the /tags/ list page

[permalinks]
  blog = "/blog/:year/:slug/"

[taxonomies]
  tag = "tags"

[params]
  description = "Vasken Dermardiros - building engineering, controls, machine learning."
  dateFormat = "January 2, 2006"

[markup]
  [markup.goldmark.renderer]
    unsafe = true              # allow raw HTML from the exporter (figures, asciiart)
  [markup.highlight]
    noClasses = false          # emit classes so the theme controls colors
    lineNos = false
    style = "bw"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
